[package]
name = "rpi-tone-over-9000"
version = "0.1.1"
edition = "2021"
rust-version = "1.97"
description = "Minimal JACK-only NAM amp simulator with a 40x13 Rust TUI"
license = "MIT"

[[bin]]
name = "rpi-tone-over-9000"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.103"
crossterm = "=0.26.1"
fft-convolver = "=0.4.0"
hound = "=3.5.1"
jack = "=0.13.5"
midir = "=0.9.1"
notify = "=8.2.0"
ratatui = "=0.20.1"
rtrb = "=0.4.0"
sha2 = "=0.10.9"
signal-hook = "=0.3.18"
unicode-width = "=0.1.14"

[build-dependencies]
cc = "=1.4.4"
pkg-config = "=0.3.34"

[profile.dev]
opt-level = 2

[profile.release]
strip = true
lto = true
codegen-units = 1
